#
# rsymbolic2 ships from four places -- the repository, the R package, the Python
# wheel and the static web GUI -- and each has to carry its own copy of the license
# and attribution files, because a recipient of one of them never sees the other
# three (docs/84). Copies drift, and a drifted notice is worse than a missing one:
# it looks authoritative while naming the wrong copyright holder or omitting a
# component that was added since.
#
# This job is the thing that stops that. The checks themselves live in
# scripts/check_license_files.sh rather than here, for two reasons: a developer can
# run them before pushing, and the same script is what deploy-pages.yml runs inside
# its publish job. A check that only exists inside one workflow's YAML cannot be
# reused by the workflow where failing actually blocks a release.
#
# deploy-pages.yml calling it too is deliberate, not redundant. Workflows fail
# independently, so a red run here would NOT stop that workflow from publishing the
# site; the call inside the publish job is the one that can actually block it.
name: License file sync

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The checks are driven by `git ls-files`, so the repository has to be a real
      # checkout -- which actions/checkout gives us.
      - name: Checkout
        uses: actions/checkout@v7

      # Byte-compares every license-file copy it can find against the repository root,
      # requires each declared distribution to carry the complete set, requires every
      # vendored third-party file to be attributed in THIRD_PARTY_NOTICES.txt, checks
      # the KaTeX banner and its version, and checks the web GUI footer's links resolve.
      # The script's header explains why each one is there.
      - name: Licensing gate
        run: sh scripts/check_license_files.sh
