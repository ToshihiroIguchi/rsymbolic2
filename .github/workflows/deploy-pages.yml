#
# Builds the WebAssembly module (web/wasm/) and deploys the static web GUI
# (web/app/) to GitHub Pages. The emsdk version is pinned (not "latest") so CI
# produces the same deterministic WASM output as the locally verified build
# (docs/51) -- an unpinned toolchain could silently change codegen/libm and
# invalidate the parity guarantees the site's README documents. The Node
# parity test is the correctness gate: it must pass before anything is
# published.
name: Deploy web GUI to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "r-package/rsymbolic2/src/**"
      # The WASM build compiles the core list defined here, and the check inside it is
      # what catches a core .cpp that was added to src/ but not to the list. Without
      # this path a change confined to the list would not rebuild the published module.
      - "cmake/**"
      # The licensing gate below is this script compared against these three files. A
      # change to either side has to re-run the gate: the site is a redistribution, and
      # a root notice edited without the published copy following it must block the
      # deploy rather than leave the site serving the older text.
      - "scripts/check_license_files.sh"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.txt"

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight deployment finish
# rather than cancel it mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to 6.0.2 (the version this project is developed/verified against,
      # per web/README.md) -- never "latest". The official emsdk installer is
      # used directly (no third-party setup action, per the dependency policy);
      # emsdk_env.sh must be sourced in the same step as the build.
      - name: Install emsdk 6.0.2 and build WebAssembly module
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install 6.0.2
          ./emsdk/emsdk activate 6.0.2
          source ./emsdk/emsdk_env.sh
          bash web/wasm/build.sh

      # Licensing gate (docs/84). web/app is what gets published, so it carries its own
      # copies of LICENSE / NOTICE / THIRD_PARTY_NOTICES.txt -- the site has to be
      # self-contained, and the footer links to them by relative path. Copies drift; a
      # drifted copy is worse than none, because it looks authoritative while being stale.
      # This fails the deploy rather than shipping a notice that no longer matches the
      # repository root.
      #
      # The same script runs in license-sync.yml. Running it here as well is what makes
      # it able to stop a release: workflows fail independently, so a red run there would
      # not hold up this one. It runs AFTER the WASM build above, so the vendored
      # rsymbolic2.js / rsymbolic2.wasm it checks are the artefacts about to be published
      # rather than the committed ones.
      - name: Licensing gate
        run: sh scripts/check_license_files.sh

      # Correctness gate: recovery + determinism (and Python cross-check,
      # best-effort -- it skips itself when the Python package isn't
      # importable, which is expected in this CI environment). Node is
      # preinstalled on ubuntu-latest; no npm install needed.
      - name: Run parity test (correctness gate)
        run: node web/wasm/test/parity_test.cjs

      # Attempts to enable Pages for the repo automatically. If this fails on
      # the first run, enable it manually once: Settings -> Pages -> Source:
      # GitHub Actions.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # v4+ excludes hidden files (dotfiles) from the artifact; web/app has
      # none, so the default is what we want.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
