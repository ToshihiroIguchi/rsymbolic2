[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "rsymbolic2"
version = "0.1.0"
description = "Native symbolic regression (C++ core) with defaults matched to PySR (independent, unaffiliated)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Toshihiro Iguchi", email = "toshihiro.iguchi.mail@gmail.com" },
]
keywords = ["symbolic regression", "genetic programming", "machine learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# Extras used only by examples / convenience helpers, never by the core search.
pandas = ["pandas>=1.0"]
plot = ["matplotlib>=3.3"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/ToshihiroIguchi/rsymbolic2"
Issues = "https://github.com/ToshihiroIguchi/rsymbolic2/issues"

[tool.pytest.ini_options]
# Test the INSTALLED package, never the source tree next to this file. `rsymbolic2/`
# here holds only __init__.py — the compiled `_core` extension is produced by CMake at
# install time — so if this directory ends up on sys.path ahead of site-packages, the
# import fails with a bare `No module named 'rsymbolic2._core'`, which reads like a
# broken build rather than a shadowed import. `importmode = importlib` stops pytest
# prepending the rootdir, so `cd python && pytest` now exercises what `pip install .`
# actually produced (docs/74).
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.scikit-build]
# The Python package lives next to this file; the compiled _core extension is
# installed into it by CMake (see CMakeLists.txt).
wheel.packages = ["rsymbolic2"]
# An sdist must build without the rest of the repository, and the shared C++ core lives
# above this directory (in r-package/, where CRAN requires it to be). sdist.include
# cannot reach a parent path -- verified, it is accepted and silently does nothing -- so
# CMake is run before the sdist's files are collected and stages the core into
# _core_src/, which these two lines then pick up. CMakeLists.txt has the full reasoning;
# docs/85 has the alternatives that were rejected.
sdist.cmake = true
sdist.include = ["_core_src/**"]
# The repository root .gitignore already excludes python/build, python/dist and
# python/_skbuild -- but the sdist build cannot see it. scikit-build-core collects the
# sdist by walking from THIS directory and reads only the .gitignore files at or below
# it, so every rule the root file writes about python/ is invisible here, and there is
# no python/.gitignore. The result was an sdist that shipped whatever a previous local
# build had left behind, including an older tarball from python/dist. (The tarball
# currently being written escapes by accident: tarfile.add() skips the archive's own
# file. Nothing protects the earlier ones.)
#
# So the rules are restated here, where they are in scope. Keep them in step with the
# python/ entries in the root .gitignore; docs/88 has the measurement.
sdist.exclude = ["/build/**", "/dist/**", "/_skbuild/**", "/.pytest_cache/**"]
# Ship the Apache-2.0 license text, the attribution NOTICE, and the third-party license
# texts in the wheel. THIRD_PARTY_NOTICES.txt is not optional paperwork: the wheel's
# compiled _core module contains pybind11-derived code, and pybind11's BSD-3 clause 2
# requires a binary redistribution to reproduce its notice (docs/84).
wheel.license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.txt"]
cmake.version = ">=3.20"
minimum-version = "0.8"
